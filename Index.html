<!DOCTYPE html>
<html>
    <head>
        <title>Escola Omni-Force</title>
        <link href="css/style.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="Imagens/Omni-Force.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">
        <meta charset="description" content="Conteúdo do meu mundo de RPG" />
        <meta charset="keywords"
            content="RPG,Mundo,Historia,Role-Play,Escola" />
        <meta charset="author" content="Pedro Passos" />
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">
        <meta charset="utf-8" />
    </head>
    <body>
        <header>
            <div class="container">
                <div class="logo-1"><img
                        src="./Imagens/Omni-Force.png"></div><!--logo-1-->
                <div class="logo-2"><img
                        src="./Imagens/Omni-Force2.png"></div><!--logo-2-->
                <div class="clear"></div><!--clear-->
            </div><!--container-->
        </header>
        <section class="cover-form">
            <div class="container bg">
                <div class="form-container">
                    <h2>Venha fazer parte dessa escola magnífica onde o limite é
                        sua imaginação!</h2>
                    <form>
                        <div class="form-wraper">
                            <p>*Nome completo:</p>
                            <input type="text" name="nome" required
                                placeholder="*Nome">
                        </div><!--form-wraper-->

                        <div class="form-wraper">
                            <p>*E-mail</p>
                            <input type="email" name="email" required
                                placeholder="*E-mail">
                        </div><!--form-wraper-->

                        <div class="form-wraper">
                            <p>*Tag do Discord</p>
                            <input type="text" name="discord" required
                                placeholder="*Tag do Discord">
                        </div><!--form-wraper-->

                        <div class="form-wraper">
                            <input type="submit" name="acao" value="Enviar">
                        </div><!--form-wraper-->

                        <div class="form-wraper">
                            <p>* Campos obrigatorios</p>
                        </div><!--form-wraper-->
                    </form>
                </div><!--form-container-->
            </div><!--container-->
        </section><!--cover-form-->
        <section class="chamada">
            <div><h2>"Um lugar de tudo para todos"</h2></div>
            <div><p>Dá só uma olhada no que temos a oferecer</p></div>
        </section><!--chamada-->
    </body>
</html>
<!-- A Escola Omni-Force é o futuro do nosso mundo, formando heróis, reis, sábios e líderes espirituais. Contamos com os melhores professores em cada área do conhecimento, proporcionando uma educação de excelência e preparando nossos alunos para os desafios da vida. Além disso, estimulamos constantemente o espírito de superação e a competitividade saudável por meio de eventos mensais, desafios e atividades extracurriculares que enriquecem o aprendizado e desenvolvem habilidades essenciais para o sucesso. -->
